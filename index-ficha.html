<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-ficha.css">
  <title>Ficha: A Realidade RPG</title>
</head>
<body>
  <button class="botao-voltar" onclick="window.location.href='index-suas-fichas.html'" type="button">← Voltar</button>
  <br><br><br>

  <main id="tela-ficha" class="tela-ficha">
    <section class="painel-ficha">
      <header class="cabecalho-ficha">
        <div class="area-foto-ficha">
          <label class="controle-foto-ficha" for="input-foto-ficha" title="Adicionar ou alterar foto">
            <input id="input-foto-ficha" type="file" accept="image/*" hidden>
            <img id="imagem-foto-ficha" class="imagem-foto-ficha" alt="Foto do personagem" hidden>
            <span id="sem-foto-ficha" class="sem-foto-ficha">+</span>
          </label>
          <button id="remover-foto-ficha" class="botao-remover-foto-ficha" type="button" title="Remover foto" aria-label="Remover foto" hidden>×</button>
        </div>
        <input id="nome-personagem-ficha" class="nome-personagem-ficha" type="text" maxlength="80" value="Nome do Personagem" aria-label="Nome do personagem">
      </header>

      <nav class="menu-ficha" role="tablist" aria-label="Áreas da ficha">
        <button class="aba-ficha ativa" type="button" role="tab" aria-selected="true" data-aba="informacoes">INFORMAÇÕES</button>
        <button class="aba-ficha" type="button" role="tab" aria-selected="false" data-aba="pontos-ficha">PONTOS DE FICHA</button>
        <button class="aba-ficha" type="button" role="tab" aria-selected="false" data-aba="habilidades">HABILIDADES</button>
        <button class="aba-ficha" type="button" role="tab" aria-selected="false" data-aba="inventario">INVENTÁRIO</button>
        <span id="indicador-menu-ficha" class="indicador-menu-ficha"></span>
      </nav>

      <div class="conteudo-ficha">
        <section id="aba-informacoes" class="conteudo-aba-ficha ativo" role="tabpanel">
          <div class="grade-informacoes-ficha">

            <div class="grupo-ocupacoes-ficha">
              <label class="campo-informacao-ficha">
                <span style="text-shadow: 0 0 10px rgb(200,0,255);">OCUPAÇÃO 1</span>

                <select id="ocupacao-1-ficha">
                  <option value="">Ocupação atual</option>
                </select>
              </label>

              <label class="campo-informacao-ficha">
                <span style="text-shadow: 0 0 10px rgb(220,100,255);">OCUPAÇÃO 2</span>

                <select id="ocupacao-2-ficha">
                  <option value="">Nenhuma</option>
                </select>
              </label>
            </div>

            <label class="campo-informacao-ficha campo-perfil-ficha">
              <span style="text-shadow: 0 0 10px rgb(0,225,240);">PERFIL</span>
              <select id="perfil-ficha">
                <option value="proativo">PROATIVO</option>
                <option value="reflexivo">REFLEXIVO</option>
                <option value="adaptativo">ADAPTATIVO</option>
              </select>
            </label>

            <label class="campo-informacao-ficha campo-idade-ficha">
              <span style="text-shadow: 0 0 10px rgb(200,190,0);">IDADE</span>
              <input id="idade-ficha" type="number" min="0" inputmode="numeric">
            </label>

            <label class="campo-informacao-ficha campo-texto-ficha">
              <span style="text-shadow: 0 0 10px rgb(230,230,230);">APARÊNCIA</span>
              <textarea id="aparencia-ficha" placeholder="Descreva a aparência do personagem..."></textarea>
            </label>

            <label class="campo-informacao-ficha campo-texto-ficha">
              <span style="text-shadow: 0 0 10px rgb(200,190,0);">PASSADO</span>
              <textarea id="passado-ficha" placeholder="Escreva o passado do personagem..."></textarea>
            </label>

            <label class="campo-informacao-ficha campo-texto-ficha">
              <span style="text-shadow: 0 0 10px rgb(220,100,255);">ANOTAÇÕES</span>
              <textarea id="anotacoes-ficha" placeholder="Adicione suas anotações..."></textarea>
            </label>

          </div>
        </section>
        
        <section id="aba-pontos-ficha" class="conteudo-aba-ficha" role="tabpanel">
          
        </section>

        <section id="aba-habilidades" class="conteudo-aba-ficha" role="tabpanel"></section>

        <section id="aba-inventario" class="conteudo-aba-ficha" role="tabpanel"></section>
        
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="ficha.js"></script>
</body>
</html>
